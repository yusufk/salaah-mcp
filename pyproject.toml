[project]
name = "salaah-mcp"
version = "0.1.0"
description = "Muslim Community Prayer Times Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn>=0.34",
    "islamic-times>=3.1.0",
    "pydantic>=2.5.3",
    "mcp>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
